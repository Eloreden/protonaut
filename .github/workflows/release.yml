name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -tags webkit2_41 -trimpath -ldflags "-w -s"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonaut-linux-amd64
          path: build/bin/Protonaut

  appimage:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-appimage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la storia + i tag per calcolare la prossima versione

      - name: Compute next version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            ver=${latest#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$ver"
            next="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Ultima versione: ${latest:-nessuna} → nuova: $next"
          echo "VERSION=$next" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build AppImage
        run: bash packaging/appimage/build.sh   # legge VERSION dall'ambiente

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "packaging/appimage/build/Protonaut-${VERSION}-x86_64.AppImage" \
            "packaging/appimage/build/Protonaut-${VERSION}-x86_64.AppImage.zsync"

  publish-aur:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # storia completa: pkgver() usa git rev-list --count

      - name: Compute pkgver from git HEAD
        run: |
          PKGVER="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          echo "Computed pkgver: $PKGVER"
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: protonaut-git
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Eloreden
          commit_email: luca.morleschi@outlook.it
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Bump to ${{ github.sha }}"
          ssh_keyscan_types: rsa,ed25519
